<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login Admin - Kopi Jago</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --jago-red: #ed1b3b;
            --jago-red-dark: #c9122f;
            --dark: #171824;
            --dark-soft: #20212e;
            --text-dark: #252936;
            --text-muted: #858895;
            --border: #e7e8ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            min-height: 100vh;
            background: #171824;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            overflow: hidden;
        }

        /* ================= BACKGROUND ================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .background::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(23, 24, 36, 0.98) 0%,
                    rgba(23, 24, 36, 0.94) 38%,
                    rgba(23, 24, 36, 0.72) 100%
                );
        }

        .background::after {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            right: -250px;
            top: -250px;
            background: rgba(237, 27, 59, 0.12);
            border-radius: 50%;
            filter: blur(20px);
        }

        .shape-one {
            position: absolute;
            width: 450px;
            height: 450px;
            left: -280px;
            bottom: -250px;
            border-radius: 50%;
            background: rgba(237, 27, 59, 0.08);
            filter: blur(10px);
        }

        .shape-two {
            position: absolute;
            width: 180px;
            height: 180px;
            right: 18%;
            bottom: -90px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.06);
        }

        /* ================= LOGIN CONTAINER ================= */

        .login-container {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 950px;
            min-height: 570px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: #ffffff;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.38),
                0 5px 20px rgba(0,0,0,0.15);

            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ================= LEFT PANEL ================= */

        .brand-panel {
            position: relative;

            background:
                linear-gradient(
                    145deg,
                    #ed1b3b 0%,
                    #d91435 55%,
                    #b90f2c 100%
                );

            padding: 55px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow: hidden;

            color: #ffffff;
        }

        .brand-panel::before {
            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.12);

            right: -260px;
            top: -180px;
        }

        .brand-panel::after {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            border: 1px solid rgba(255,255,255,0.10);

            left: -190px;
            bottom: -170px;
        }

        .brand-content {
            position: relative;
            z-index: 2;
        }

        .brand-name {
            font-family: 'Montserrat', sans-serif;

            font-size: 34px;

            font-weight: 900;

            font-style: italic;

            letter-spacing: 1px;

            margin-bottom: 45px;
        }

        .brand-line {
            width: 48px;
            height: 4px;

            background: #ffffff;

            border-radius: 10px;

            margin-bottom: 25px;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;

            font-size: 34px;

            line-height: 1.2;

            font-weight: 800;

            max-width: 350px;
        }

        .brand-description {
            margin-top: 18px;

            max-width: 330px;

            color: rgba(255,255,255,0.82);

            font-size: 14px;

            line-height: 1.7;
        }

        .brand-footer {
            position: relative;
            z-index: 2;

            font-size: 11px;

            color: rgba(255,255,255,0.65);

            letter-spacing: 0.3px;
        }

        /* ================= RIGHT PANEL ================= */

        .login-panel {
            background: #ffffff;

            padding: 55px;

            display: flex;
            flex-direction: column;

            justify-content: center;
        }

        .login-header {
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-family: 'Montserrat', sans-serif;

            color: var(--text-dark);

            font-size: 25px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .login-header p {
            color: var(--text-muted);

            font-size: 13px;

            line-height: 1.6;
        }

        /* ================= ERROR ================= */

        .error-msg {
            display: none;

            background: #fff1f3;

            color: #d51b38;

            border: 1px solid #ffd4db;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 12px;

            margin-bottom: 18px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            color: var(--text-dark);

            font-size: 11px;

            font-weight: 700;

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 0.4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #a2a5b1;

            font-size: 14px;

            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;

            height: 48px;

            border: 1px solid var(--border);

            border-radius: 9px;

            outline: none;

            padding:
                0 45px
                0 42px;

            font-family: 'Open Sans', sans-serif;

            font-size: 13px;

            color: var(--text-dark);

            background: #fafbfc;

            transition: all 0.2s ease;
        }

        .input-wrapper input:hover {
            border-color: #d5d7de;
        }

        .input-wrapper input:focus {
            background: #ffffff;

            border-color: var(--jago-red);

            box-shadow:
                0 0 0 3px rgba(237,27,59,0.08);
        }

        .input-wrapper input::placeholder {
            color: #a5a7b0;
        }

        .password-toggle {
            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #a2a5b1;

            cursor: pointer;

            padding: 5px;

            font-size: 13px;
        }

        .password-toggle:hover {
            color: var(--jago-red);
        }

        /* ================= LOGIN BUTTON ================= */

        .btn-login {
            width: 100%;

            height: 48px;

            border: none;

            border-radius: 9px;

            background: var(--jago-red);

            color: #ffffff;

            font-family: 'Montserrat', sans-serif;

            font-size: 12px;

            font-weight: 800;

            letter-spacing: 0.3px;

            cursor: pointer;

            margin-top: 8px;

            transition: all 0.2s ease;

            box-shadow:
                0 6px 15px rgba(237,27,59,0.22);
        }

        .btn-login:hover {
            background: var(--jago-red-dark);

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(237,27,59,0.28);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        /* ================= FOOTER ================= */

        .login-footer {
            text-align: center;

            margin-top: 25px;

            color: #a0a2ac;

            font-size: 10px;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            body {
                padding: 20px;
                overflow-y: auto;
            }

            .login-container {
                max-width: 480px;

                grid-template-columns: 1fr;

                min-height: auto;
            }

            .brand-panel {
                padding: 35px;

                min-height: 260px;
            }

            .brand-name {
                font-size: 28px;

                margin-bottom: 25px;
            }

            .brand-title {
                font-size: 27px;
            }

            .brand-description {
                display: none;
            }

            .brand-footer {
                margin-top: 30px;
            }

            .login-panel {
                padding: 40px 35px;
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .login-container {
                border-radius: 16px;
            }

            .brand-panel {
                padding: 30px;
            }

            .brand-title {
                font-size: 24px;
            }

            .login-panel {
                padding: 32px 25px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

    <!-- BACKGROUND -->
    <div class="background">
        <div class="shape-one"></div>
        <div class="shape-two"></div>
    </div>


    <!-- LOGIN CONTAINER -->
    <div class="login-container">


        <!-- ================= LEFT BRAND ================= -->

        <section class="brand-panel">

            <div class="brand-content">

                <div class="brand-name">
                    JAGO
                </div>

                <div class="brand-line"></div>

                <h2 class="brand-title">
                    Admin Dashboard
                </h2>

                <p class="brand-description">
                    Kelola operasional Kopi Jago dengan mudah
                    melalui dashboard admin.
                </p>

            </div>


            <div class="brand-footer">
                © 2026 Kopi Jago · Admin Panel
            </div>

        </section>


        <!-- ================= LOGIN ================= -->

        <section class="login-panel">

            <div class="login-header">

                <h1>
                    KOPI JAGO ADMIN
                </h1>

                <p>
                    Masuk untuk mengakses dashboard administrasi.
                </p>

            </div>


            <!-- ERROR -->
            <div id="error-message" class="error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                &nbsp; Username atau password salah.
            </div>


            <!-- FORM -->
            <form id="login-form">

                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                            value="admin"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                            value="admin123"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Tampilkan password">

                            <i
                                id="password-icon"
                                class="fa-solid fa-eye">
                            </i>

                        </button>

                    </div>

                </div>


                <!-- LOGIN -->
                <button
                    type="submit"
                    class="btn-login"
                    id="login-button">

                    LOGIN SEKARANG

                </button>

            </form>


            <div class="login-footer">
                Gunakan akun admin untuk melanjutkan
            </div>

        </section>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* =========================================
           CEK LOGIN
        ========================================= */

        if (
            localStorage.getItem('admin_logged_in')
            === 'true'
        ) {

            window.location.href = 'dashboard.html';

        }


        /* =========================================
           LOGIN
        ========================================= */

        document
            .getElementById('login-form')
            .addEventListener('submit', function(e) {

                e.preventDefault();


                const user =
                    document
                    .getElementById('username')
                    .value
                    .trim();


                const pass =
                    document
                    .getElementById('password')
                    .value;


                const errorMsg =
                    document
                    .getElementById('error-message');


                const loginButton =
                    document
                    .getElementById('login-button');


                /* Hide error */

                errorMsg.style.display = 'none';


                /* Authentication */

                if (
                    user === 'admin'
                    &&
                    pass === 'admin123'
                ) {

                    loginButton
                        .classList
                        .add('loading');

                    loginButton.innerHTML =
                        '<i class="fa-solid fa-spinner fa-spin"></i> MEMBUKA DASHBOARD...';


                    localStorage.setItem(
                        'admin_logged_in',
                        'true'
                    );


                    localStorage.setItem(
                        'admin_user',
                        'Admin Jago'
                    );


                    setTimeout(function() {

                        window.location.href =
                            'dashboard.html';

                    }, 500);

                }

                else {

                    errorMsg.style.display =
                        'block';

                    loginButton.innerHTML =
                        'LOGIN SEKARANG';

                }

            });


        /* =========================================
           SHOW / HIDE PASSWORD
        ========================================= */

        function togglePassword() {

            const password =
                document
                .getElementById('password');


            const icon =
                document
                .getElementById('password-icon');


            if (
                password.type === 'password'
            ) {

                password.type = 'text';

                icon.classList.remove(
                    'fa-eye'
                );

                icon.classList.add(
                    'fa-eye-slash'
                );

            }

            else {

                password.type = 'password';

                icon.classList.remove(
                    'fa-eye-slash'
                );

                icon.classList.add(
                    'fa-eye'
                );

            }

        }

    </script>

</body>
</html>
