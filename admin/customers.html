<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Admin Kopi Jago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/jago-global.css">
    <link rel="stylesheet" href="../assets/css/jago-components.css">
    <link rel="stylesheet" href="../assets/css/admin-components.css">
    <link rel="stylesheet" href="admin-layout.css">
    <style>
        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--jago-gray-200);
            border-radius: 8px;
            font: 400 14px var(--font-body);
            transition: border-color 0.2s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--jago-red);
        }
        .customer-detail-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .customer-detail-modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--jago-gray-400);
        }
        .customer-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .info-item label {
            display: block;
            font: 600 12px var(--font-body);
            color: var(--jago-gray-700);
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .info-item .value {
            font: 400 15px var(--font-body);
            color: var(--jago-black);
        }
        .section-divider {
            height: 1px;
            background: var(--jago-gray-200);
            margin: 24px 0;
        }
    </style>
</head>
<body class="admin-body">
    <!-- TOP NAVBAR -->
    <nav class="admin-topnav">
        <div class="admin-topnav-left">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                <span></span><span></span><span></span>
            </button>
            <img src="../logo jago2.png" alt="Jago Coffee" class="admin-logo">
        </div>
        
        <div class="admin-topnav-right">
            <div class="admin-user-menu">
                <span id="admin-name">Admin</span>
                <button id="admin-logout" class="btn-ghost btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <!-- SIDEBAR -->

        <nav class="admin-nav">

                <span>Dashboard</span>
            </a>
            
            <a href="orders.html" class="admin-nav-item" data-page="orders">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>Orders</span>
                <span class="nav-badge" id="pending-orders-badge">0</span>
            </a>
            
            <a href="customers.html" class="admin-nav-item active" data-page="customers">

                <span>Customers</span>
            </a>
            
            <a href="menu.html" class="admin-nav-item" data-page="menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>

                <span class="nav-badge badge-warning" id="low-stock-badge">0</span>
            </a>
            
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
            </a>
            
            <a href="payments.html" class="admin-nav-item" data-page="payments">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                <span>Payments</span>
            </a>
            
            <a href="analytics.html" class="admin-nav-item" data-page="analytics">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
                <span>Analytics</span>
            </a>
            
            <a href="reports.html" class="admin-nav-item" data-page="reports">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                <span>Reports</span>
            </a>
            
            <div class="admin-nav-divider"></div>
            
            </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
        <div class="admin-page-header">
            <h1 class="admin-page-title">Customers</h1>
            <p class="admin-page-subtitle">Manage customer accounts and view order history</p>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-bar">
            <input 
                type="text" 
                id="search-input" 
                class="search-input" 
                placeholder="Search by name, email, or phone..."
            >
            <button class="btn btn-primary" onclick="performSearch()">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                Search
            </button>
        </div>

        <!-- CUSTOMERS TABLE -->
        <div class="data-table-container">
            <div class="data-table-header">
                <h3 class="data-table-title">Customer List</h3>
                <span id="customers-count">0 customers</span>
            </div>
            <div id="customers-table-content"></div>
        </div>
    </main>

    <!-- CUSTOMER DETAIL MODAL -->
    <div class="customer-detail-modal" id="customer-modal">
        <div class="modal-content" id="modal-content">
            <!-- Content injected by JS -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/jago-core.js"></script>
    <script src="../assets/js/jago-components.js"></script>
    <script src="admin-core-fix.js"></script>
    <script src="admin-core.js"></script>
    <script src="customers.js"></script>
</body>
</html>
