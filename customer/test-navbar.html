<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Navbar - Kopi Jago</title>
    <link rel="stylesheet" href="../assets/css/jago-global.css">
    <link rel="stylesheet" href="../assets/css/jago-components.css">
    <link rel="stylesheet" href="../assets/css/customer-components.css">
    <style>
        body { padding-top: 80px; }
        .test-panel { max-width: 800px; margin: 40px auto; padding: 20px; background: #f5f5f5; border-radius: 8px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        .info { background: #d1ecf1; }
        pre { background: white; padding: 10px; overflow-x: auto; font-size: 12px; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <!-- NAVBAR SAMA SEPERTI DI HOME.HTML -->
    <nav class="customer-navbar" id="navbar">
        <a href="home.html#home">
            <img src="../logo jago2.png" alt="Jago Coffee" class="navbar-logo">
        </a>
        
        <button class="navbar-hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <ul class="navbar-menu" id="nav-menu">
            <li><a href="home.html#home" class="navbar-link active">Home</a></li>
            <li><a href="home.html#menu" class="navbar-link">Menu</a></li>
            <li><a href="find-jagoan.html" class="navbar-link">Find Jagoan</a></li>
            <li><a href="cart.html" class="navbar-link">Keranjang <span id="cart-badge" class="navbar-badge">(0)</span></a></li>
            <li><a href="orders.html" class="navbar-link">Pesanan</a></li>
            <li><a href="jago-party.html" class="navbar-link">Jago Party</a></li>
        </ul>
        
        <div class="navbar-account" id="account-area"></div>
    </nav>

    <div class="test-panel">
        <h1>🧪 Navbar Authentication Test</h1>
        
        <h2>Actions</h2>
        <button onclick="simulateLogin()">Simulate Login</button>
        <button onclick="simulateLogout()">Simulate Logout</button>
        <button onclick="refreshNavbar()">Refresh Navbar</button>
        <button onclick="checkState()">Check State</button>
        
        <h2>Test Results</h2>
        <div id="results"></div>
        
        <h2>LocalStorage State</h2>
        <pre id="storage"></pre>
        
        <h2>Account Area HTML</h2>
        <pre id="account-html"></pre>
    </div>

    <script src="../assets/js/jago-core.js"></script>
    <script src="../assets/js/jago-components.js"></script>
    <script src="../assets/js/jago-navbar.js"></script>
    
    <script>
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${msg}`;
            document.getElementById('results').insertBefore(div, document.getElementById('results').firstChild);
        }
        
        function updateDisplay() {
            // Storage state
            const storage = {
                kj_token: localStorage.getItem('kj_token'),
                kj_user: localStorage.getItem('kj_user'),
                kj_role: localStorage.getItem('kj_role')
            };
            document.getElementById('storage').textContent = JSON.stringify(storage, null, 2);
            
            // Account area HTML
            const accountArea = document.getElementById('account-area');
            document.getElementById('account-html').textContent = accountArea ? accountArea.innerHTML : 'NOT FOUND';
        }
        
        function simulateLogin() {
            log('Simulating login...', 'info');
            
            const mockUser = {
                id: 1,
                name: 'Test Customer',
                email: 'test@example.com',
                phone: '081234567890'
            };
            
            localStorage.setItem('kj_token', 'mock_token_' + Date.now());
            localStorage.setItem('kj_role', 'customer');
            localStorage.setItem('kj_user', JSON.stringify(mockUser));
            
            log('✅ Mock credentials saved to localStorage', 'success');
            
            // Force navbar update
            if (window.jagoNavbar) {
                window.jagoNavbar.updateAccountDisplay();
                log('✅ Navbar updateAccountDisplay() called', 'success');
            } else {
                log('❌ window.jagoNavbar not found', 'error');
            }
            
            updateDisplay();
        }
        
        function simulateLogout() {
            log('Simulating logout...', 'info');
            
            localStorage.removeItem('kj_token');
            localStorage.removeItem('kj_role');
            localStorage.removeItem('kj_user');
            localStorage.removeItem('token');
            
            log('✅ LocalStorage cleared', 'success');
            
            if (window.jagoNavbar) {
                window.jagoNavbar.updateAccountDisplay();
                log('✅ Navbar updated', 'success');
            }
            
            updateDisplay();
        }
        
        function refreshNavbar() {
            if (!window.jagoNavbar) {
                log('❌ window.jagoNavbar not available', 'error');
                return;
            }
            
            window.jagoNavbar.updateAccountDisplay();
            window.jagoNavbar.updateCartBadge();
            log('✅ Navbar refreshed', 'success');
            updateDisplay();
        }
        
        function checkState() {
            log('Checking system state...', 'info');
            
            // Check KJAuth
            if (typeof KJAuth === 'undefined') {
                log('❌ KJAuth is NOT defined', 'error');
            } else {
                log('✅ KJAuth is defined', 'success');
                log(`  - isAuthenticated(): ${KJAuth.isAuthenticated()}`, KJAuth.isAuthenticated() ? 'success' : 'info');
                log(`  - getToken(): ${KJAuth.getToken() ? 'YES' : 'NO'}`, KJAuth.getToken() ? 'success' : 'info');
                log(`  - getUser(): ${JSON.stringify(KJAuth.getUser())}`, 'info');
            }
            
            // Check navbar instance
            if (typeof window.jagoNavbar === 'undefined') {
                log('❌ window.jagoNavbar is NOT defined', 'error');
            } else {
                log('✅ window.jagoNavbar is defined', 'success');
            }
            
            // Check account-area element
            const accountArea = document.getElementById('account-area');
            if (!accountArea) {
                log('❌ #account-area element NOT FOUND', 'error');
            } else {
                log('✅ #account-area element exists', 'success');
                log(`  - innerHTML length: ${accountArea.innerHTML.length}`, 'info');
            }
            
            updateDisplay();
        }
        
        // Auto-run on load
        window.addEventListener('DOMContentLoaded', () => {
            log('✅ DOMContentLoaded fired', 'success');
            
            setTimeout(() => {
                checkState();
                updateDisplay();
            }, 500);
        });
    </script>
</body>
</html>
