<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pembayaran - Kopi Jago</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .payment-page{background:#f8f3ee;min-height:100vh;padding-top:100px}
        .payment-container{max-width:900px;margin:0 auto;padding:20px 6% 60px}
        .payment-title{font:900 32px Montserrat,sans-serif;color:#4b2e22;margin:0 0 32px}
        .section-box{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(75,46,34,0.08);padding:28px;margin-bottom:24px}
        .section-title{font:700 20px Montserrat,sans-serif;color:#4b2e22;margin:0 0 20px}
        .method-card{border:2px solid #eadfd7;padding:18px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:14px;transition:all .2s;min-height:70px}
        .method-card:hover{border-color:#bd3d2f;background:#fef5f3}
        .method-card.selected{border-color:#bd3d2f;background:#fef5f3}
        .method-icon{font-size:32px;min-width:40px;text-align:center}
        .method-name{font:600 16px Montserrat,sans-serif;color:#4b2e22}
        #bank-selector{display:none;margin-top:16px}
        .bank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
        .bank-btn{border:1px solid #ddd;background:#fff;padding:12px;border-radius:6px;cursor:pointer;font:600 12px Montserrat,sans-serif;transition:all .2s;min-height:44px;display:flex;align-items:center;justify-content:center}
        .bank-btn:hover{border-color:#bd3d2f;background:#fef5f3}
        .bank-btn.selected{border-color:#bd3d2f;background:#fef5f3;color:#bd3d2f}
        .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
        .summary-row.total{font-weight:700;font-size:18px;color:#4b2e22;border-top:2px solid #eadfd7;margin-top:12px;padding-top:16px}
        .btn-submit{width:100%;border:0;background:#bd3d2f;color:#fff;padding:16px;border-radius:8px;cursor:pointer;font:700 14px Montserrat,sans-serif;text-transform:uppercase;margin-top:20px;transition:background .2s;min-height:54px}
        .btn-submit:hover{background:#a53527}
        .btn-submit:disabled{opacity:.6;cursor:not-allowed}
        @media(max-width:768px){
            .payment-page{padding-top:80px}
            .payment-container{padding:20px 4% 40px}
            .payment-title{font-size:26px;margin-bottom:24px}
            .section-box{padding:20px}
            .bank-grid{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
        }
        #payment-instructions{display:none;margin-top:24px}
        .qr-container,.va-container{text-align:center}
        .qr-image{max-width:280px;margin:16px auto;border:1px solid #ddd;padding:16px;border-radius:8px}
        .va-box{display:flex;align-items:center;gap:12px;justify-content:center;margin:16px 0;padding:16px;background:#f8f3ee;border-radius:6px}
        .va-number{font:700 20px monospace;color:#4b2e22}
        .copy-btn{border:0;background:#bd3d2f;color:#fff;padding:8px 16px;border-radius:4px;cursor:pointer}
        .instructions{text-align:left;margin-top:24px;padding:16px;background:#f8f3ee;border-radius:6px}
        .instructions ol{margin:8px 0;padding-left:24px}
    </style>
</head>
<body class="customer-page payment-page">
    <header class="customer-nav" id="navbar">
        <a href="home.html" aria-label="Kopi Jago">
            <img src="../logo%20jago2.png" alt="Jago Coffee" class="nav-logo">
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="customer-links" id="nav-links">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="cart.html">Keranjang</a>
            <a href="orders.html">Pesanan</a>
        </nav>
        <div id="account-area" class="customer-account"></div>
    </header>
    
    <main class="payment-container">
        <h1 class="payment-title">Pembayaran</h1>
        
        <div class="section-box">
            <h2 class="section-title">Ringkasan Pesanan</h2>
            <div id="order-summary"></div>
        </div>
        
        <div class="section-box">
            <h2 class="section-title">Metode Pembayaran</h2>
            <div id="payment-methods"></div>
            <div id="bank-selector"></div>
            <button id="btn-pay" class="btn-submit">Tampilkan QR Code</button>
        </div>
        
        <div id="payment-instructions" class="section-box"></div>
    </main>
    
    <footer class="customer-footer">© 2026 Kopi Jago. Minuman favorit, diantar dengan jago.</footer>
    
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key=""></script>
    <script src="shared.js"></script>
    <script>
        // Get client key from API on page load
        (async function loadClientKey() {
            try {
                const res = await fetch(api('payments/config'));
                const data = await res.json();
                if (data.client_key) {
                    document.querySelector('script[data-client-key]').setAttribute('data-client-key', data.client_key);
                }
            } catch (err) {
                console.warn('Could not load Midtrans client key:', err);
            }
        })();
    </script>
    <script src="payment.js"></script>
</body>
</html>
