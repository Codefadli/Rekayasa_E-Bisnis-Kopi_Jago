<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil - Kopi Jago</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .customer-page{background:#f8f3ee;color:#34251e;min-height:100vh;display:flex;flex-direction:column}
        .customer-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 6%;background:#fff;box-shadow:0 2px 12px #0002}
        .customer-nav img{width:118px;height:auto}.customer-links{display:flex;align-items:center;gap:20px;font:600 13px 'Open Sans',sans-serif;color:#4b2e22}.customer-links a:hover{color:#bd3d2f}.customer-links a.active{color:#bd3d2f;border-bottom:2px solid #bd3d2f}
        .customer-account{display:flex;align-items:center;gap:10px;font:600 13px 'Open Sans',sans-serif}.customer-account a,.customer-account button{border:0;background:none;color:#4b2e22;padding:8px;cursor:pointer}.customer-account .primary{background:#bd3d2f;color:#fff;border-radius:3px}
        .customer-main{max-width:700px;margin:auto;padding:54px 6%;flex:1}.page-heading{margin-bottom:32px;text-align:center}.page-heading h1{margin:0 0 8px;font:900 32px Montserrat,sans-serif;color:#4b2e22}.page-heading p{color:#806d62;margin:0}
        .profile-card{background:#fff;border-radius:8px;box-shadow:0 4px 18px #4b2e2215;padding:32px}
        .profile-row{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid #eadfd7}.profile-row:last-child{border:0;margin-bottom:0}
        .profile-label{font:600 13px Montserrat,sans-serif;color:#8b7568;text-transform:uppercase}.profile-value{font:400 16px 'Open Sans',sans-serif;color:#4b2e22}
        .profile-actions{display:flex;flex-direction:column;gap:12px;margin-top:32px}
        .profile-btn{border:0;padding:14px;border-radius:6px;cursor:pointer;font:600 13px Montserrat,sans-serif;text-align:center;text-transform:uppercase}.logout-btn{background:#bd3d2f;color:#fff}.logout-btn:hover{background:#a53527}.menu-btn{background:#fff;color:#bd3d2f;border:1px solid #bd3d2f}.menu-btn:hover{background:#fef5f3}
        .empty-state{text-align:center;padding:80px 20px}.empty-state h2{font:700 24px Montserrat,sans-serif;color:#4b2e22;margin:0 0 12px}.empty-state p{color:#806d62;margin:0 0 24px}.empty-state a{display:inline-block;background:#bd3d2f;color:#fff;padding:12px 28px;border-radius:4px;font:600 13px Montserrat,sans-serif;text-decoration:none}.empty-state a:hover{background:#a53527}
        .customer-footer{padding:32px 6%;background:#4b2e22;color:#fff;text-align:center;font-size:13px;margin-top:auto}
        @media(max-width:760px){.customer-nav{flex-wrap:wrap;padding:14px 5%}.customer-links{order:3;width:100%;justify-content:space-between;gap:8px}.customer-links a{font-size:11px}.customer-account{margin-left:auto}.customer-main{padding:38px 5%}}
    </style>
</head>
<body class="customer-page">
    <header class="customer-nav">
        <a href="home.html" aria-label="Kopi Jago"><img src="../logo%20jago2.png" alt="Jago Coffee"></a>
        <nav class="customer-links" aria-label="Navigasi customer">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="cart.html">Keranjang <span id="cart-badge">(0)</span></a>
            <a href="orders.html">Pesanan</a>
            <a href="wishlist.html">Wishlist</a>
        </nav>
        <div id="account-area" class="customer-account"></div>
    </header>
    <main class="customer-main">
        <div class="page-heading">
            <h1>Profil Saya</h1>
            <p>Informasi akun Anda</p>
        </div>
        <div id="profile-content"></div>
    </main>
    <footer class="customer-footer">© 2026 Kopi Jago. Minuman favorit, diantar dengan jago.</footer>
    <script src="../frontend/src/js/routes.js"></script>
    <script src="../frontend/src/js/api.js"></script>
    <script>
        const esc = v => String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));
        const token = () => localStorage.getItem('kj_token') || localStorage.getItem('token') || '';

        async function api(path, options = {}) {
            return (await kjRequest(path, options)).data;
        }

        function showAccount() {
            const user = JSON.parse(localStorage.getItem('kj_user') || 'null');
            const area = document.getElementById('account-area');
            area.innerHTML = token()
                ? `<span>Halo, ${esc(user?.name || 'Customer')}</span><a href="profile.html" class="active">Profil</a><button id="logout">Logout</button>`
                : '<a href="../login.html">Login</a><a class="primary" href="../login.html#register">Daftar</a>';
            document.getElementById('logout')?.addEventListener('click', logout);
        }

        async function loadCartCount() {
            if (!token()) { document.getElementById('cart-badge').textContent='(0)'; return; }
            try {
                const items = await api('cart');
                const count = items.reduce((sum, item) => sum + Number(item.qty), 0);
                document.getElementById('cart-badge').textContent=`(${count})`;
            } catch (_) {}
        }

        async function loadProfile() {
            const content = document.getElementById('profile-content');
            
            if (!token()) {
                content.innerHTML = `<div class="empty-state">
                    <h2>Login Diperlukan</h2>
                    <p>Login untuk melihat profil</p>
                    <a href="../login.html">Login Sekarang</a>
                </div>`;
                return;
            }

            try {
                const user = await api('users/profile');
                
                content.innerHTML = `
                    <div class="profile-card">
                        <div class="profile-row">
                            <span class="profile-label">Nama</span>
                            <span class="profile-value">${esc(user.name)}</span>
                        </div>
                        <div class="profile-row">
                            <span class="profile-label">Email</span>
                            <span class="profile-value">${esc(user.email)}</span>
                        </div>
                        ${user.phone ? `
                        <div class="profile-row">
                            <span class="profile-label">Telepon</span>
                            <span class="profile-value">${esc(user.phone)}</span>
                        </div>` : ''}
                        ${user.birth_date ? `
                        <div class="profile-row">
                            <span class="profile-label">Tanggal Lahir</span>
                            <span class="profile-value">${new Date(user.birth_date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'})}</span>
                        </div>` : ''}
                        <div class="profile-actions">
                            <button class="profile-btn menu-btn" onclick="location.href='menu.html'">Lihat Menu</button>
                            <button class="profile-btn logout-btn" id="logout-btn">Logout</button>
                        </div>
                    </div>
                `;

                document.getElementById('logout-btn')?.addEventListener('click', logout);

            } catch (error) {
                content.innerHTML = `<div class="empty-state"><h2>Error</h2><p>${esc(error.message)}</p></div>`;
            }
        }

        async function logout() {
            try { await api('auth/logout.php', {method:'POST'}); } catch (_) {}
            localStorage.clear();
            location.href = '../login.html';
        }

        showAccount();
        loadCartCount();
        loadProfile();
    </script>
</body>
</html>
