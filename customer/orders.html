<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pesanan - Kopi Jago</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .customer-page{background:#f8f3ee;color:#34251e;min-height:100vh;display:flex;flex-direction:column}
        .customer-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 6%;background:#fff;box-shadow:0 2px 12px #0002}
        .customer-nav img{width:118px;height:auto}.customer-links{display:flex;align-items:center;gap:20px;font:600 13px 'Open Sans',sans-serif;color:#4b2e22}.customer-links a:hover{color:#bd3d2f}.customer-links a.active{color:#bd3d2f;border-bottom:2px solid #bd3d2f}
        .customer-account{display:flex;align-items:center;gap:10px;font:600 13px 'Open Sans',sans-serif}.customer-account a,.customer-account button{border:0;background:none;color:#4b2e22;padding:8px;cursor:pointer}.customer-account .primary{background:#bd3d2f;color:#fff;border-radius:3px}
        .customer-main{max-width:1000px;margin:auto;padding:54px 6%;flex:1}.page-heading{margin-bottom:32px}.page-heading h1{margin:0 0 8px;font:900 32px Montserrat,sans-serif;color:#4b2e22}.page-heading p{color:#806d62;margin:0}
        .orders-list{display:flex;flex-direction:column;gap:20px}
        .order-card{background:#fff;border-radius:8px;box-shadow:0 4px 18px #4b2e2215;overflow:hidden}
        .order-header{padding:20px 24px;background:#fef5f3;border-bottom:1px solid #eadfd7;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
        .order-number{font:700 16px Montserrat,sans-serif;color:#4b2e22}.order-date{font-size:13px;color:#8b7568}
        .order-status{padding:6px 14px;border-radius:20px;font:600 11px Montserrat,sans-serif;text-transform:uppercase;background:#e8e8e8;color:#555}
        .order-status.pending{background:#fef3cd;color:#856404}.order-status.confirmed{background:#d4edda;color:#155724}.order-status.processing{background:#d1ecf1;color:#0c5460}.order-status.ready{background:#cce5ff;color:#004085}.order-status.on_delivery{background:#e2e3e5;color:#383d41}.order-status.completed{background:#d4edda;color:#155724}.order-status.cancelled{background:#f8d7da;color:#721c24}
        .order-body{padding:24px}.order-items{margin-bottom:16px}.order-item{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#4b2e22}.order-item span:first-child{flex:1}.order-item span:last-child{font-weight:600;color:#bd3d2f}
        .order-meta{font-size:13px;color:#8b7568;margin-bottom:12px}
        .order-total{display:flex;justify-content:space-between;padding-top:16px;border-top:2px solid #eadfd7;font:700 18px Montserrat,sans-serif;color:#4b2e22}
        .empty-state{text-align:center;padding:80px 20px;background:#fff;border-radius:8px}.empty-state h2{font:700 24px Montserrat,sans-serif;color:#4b2e22;margin:0 0 12px}.empty-state p{color:#806d62;margin:0 0 24px}.empty-state a{display:inline-block;background:#bd3d2f;color:#fff;padding:12px 28px;border-radius:4px;font:600 13px Montserrat,sans-serif;text-decoration:none}.empty-state a:hover{background:#a53527}
        .customer-footer{padding:32px 6%;background:#4b2e22;color:#fff;text-align:center;font-size:13px;margin-top:auto}
        @media(max-width:760px){.customer-nav{flex-wrap:wrap;padding:14px 5%}.customer-links{order:3;width:100%;justify-content:space-between;gap:8px}.customer-links a{font-size:11px}.customer-account{margin-left:auto}.customer-main{padding:38px 5%}.order-header{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body class="customer-page">
    <header class="customer-nav">
        <a href="home.html" aria-label="Kopi Jago"><img src="../logo%20jago2.png" alt="Jago Coffee"></a>
        <nav class="customer-links" aria-label="Navigasi customer">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="cart.html">Keranjang <span id="cart-badge">(0)</span></a>
            <a href="orders.html" class="active">Pesanan</a>
            <a href="wishlist.html">Wishlist</a>
        </nav>
        <div id="account-area" class="customer-account"></div>
    </header>
    <main class="customer-main">
        <div class="page-heading">
            <h1>Pesanan Saya</h1>
            <p>Riwayat dan status pesananmu</p>
        </div>
        <div id="orders-content"></div>
    </main>
    <footer class="customer-footer">© 2026 Kopi Jago. Minuman favorit, diantar dengan jago.</footer>
    <script src="../frontend/src/js/routes.js"></script>
    <script src="../frontend/src/js/api.js"></script>
    <script>
        const esc = v => String(v ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));
        const token = () => localStorage.getItem('kj_token') || localStorage.getItem('token') || '';
        const statusLabel = {
            'pending':'Menunggu',
            'confirmed':'Dikonfirmasi',
            'processing':'Diproses',
            'ready':'Siap',
            'on_delivery':'Dikirim',
            'completed':'Selesai',
            'cancelled':'Dibatalkan'
        };

        async function api(path, options = {}) {
            return (await kjRequest(path, options)).data;
        }

        function showAccount() {
            const user = JSON.parse(localStorage.getItem('kj_user') || 'null');
            const area = document.getElementById('account-area');
            area.innerHTML = token()
                ? `<span>Halo, ${esc(user?.name || 'Customer')}</span><a href="profile.html">Profil</a><button id="logout">Logout</button>`
                : '<a href="../login.html">Login</a><a class="primary" href="../login.html#register">Daftar</a>';
            document.getElementById('logout')?.addEventListener('click', async () => {
                try { await api('auth/logout.php', {method:'POST'}); } catch (_) {}
                localStorage.clear();
                location.href = '../login.html';
            });
        }

        async function loadCartCount() {
            if (!token()) { document.getElementById('cart-badge').textContent='(0)'; return; }
            try {
                const items = await api('cart');
                const count = items.reduce((sum, item) => sum + Number(item.qty), 0);
                document.getElementById('cart-badge').textContent=`(${count})`;
            } catch (_) {}
        }

        async function loadOrders() {
            const content = document.getElementById('orders-content');
            
            if (!token()) {
                content.innerHTML = `<div class="empty-state">
                    <h2>Login Diperlukan</h2>
                    <p>Login untuk melihat riwayat pesanan</p>
                    <a href="../login.html">Login Sekarang</a>
                </div>`;
                return;
            }

            try {
                const orders = await api('orders');
                
                if (orders.length === 0) {
                    content.innerHTML = `<div class="empty-state">
                        <h2>Belum Ada Pesanan</h2>
                        <p>Belum ada riwayat pesanan</p>
                        <a href="home.html#menu">Mulai Belanja</a>
                    </div>`;
                    return;
                }

                content.innerHTML = `<div class="orders-list">
                    ${orders.map(order => {
                        const date = new Date(order.created_at);
                        return `
                            <div class="order-card">
                                <div class="order-header">
                                    <div>
                                        <div class="order-number">${esc(order.order_number)}</div>
                                        <div class="order-date">${date.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
                                    </div>
                                    <span class="order-status ${order.status}">${statusLabel[order.status] || esc(order.status)}</span>
                                </div>
                                <div class="order-body">
                                    <div class="order-meta">
                                        Tipe: ${order.fulfillment_type === 'delivery' ? 'Delivery' : 'Pickup'} | 
                                        Pembayaran: ${order.payment_method === 'cash' ? 'Cash' : order.payment_method.toUpperCase()} 
                                        (${order.payment_status === 'paid' ? 'Lunas' : 'Belum Lunas'})
                                    </div>
                                    <div class="order-total">
                                        <span>Total</span>
                                        <span>Rp ${Number(order.total_amount).toLocaleString('id-ID')}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>`;

            } catch (error) {
                content.innerHTML = `<div class="empty-state"><h2>Error</h2><p>${esc(error.message)}</p></div>`;
            }
        }

        showAccount();
        loadCartCount();
        loadOrders();
    </script>
</body>
</html>
