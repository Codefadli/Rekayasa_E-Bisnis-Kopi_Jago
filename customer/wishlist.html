<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wishlist - Kopi Jago</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .customer-page{background:#f8f3ee;color:#34251e;min-height:100vh;display:flex;flex-direction:column}
        .customer-nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 6%;background:#fff;box-shadow:0 2px 12px #0002}
        .customer-nav img{width:118px;height:auto}.customer-links{display:flex;align-items:center;gap:20px;font:600 13px 'Open Sans',sans-serif;color:#4b2e22}.customer-links a:hover{color:#bd3d2f}.customer-links a.active{color:#bd3d2f;border-bottom:2px solid #bd3d2f}
        .customer-account{display:flex;align-items:center;gap:10px;font:600 13px 'Open Sans',sans-serif}.customer-account a,.customer-account button{border:0;background:none;color:#4b2e22;padding:8px;cursor:pointer}.customer-account .primary{background:#bd3d2f;color:#fff;border-radius:3px}
        .customer-main{max-width:1180px;margin:auto;padding:54px 6%;flex:1}.page-heading{margin-bottom:32px;text-align:center}.page-heading h1{margin:0 0 8px;font:900 32px Montserrat,sans-serif;color:#4b2e22}.page-heading p{color:#806d62;margin:0}
        .wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
        .wishlist-card{background:#fff;border-radius:8px;box-shadow:0 4px 18px #4b2e2215;overflow:hidden;display:flex;flex-direction:column}
        .wishlist-image{height:180px;background:#f1e4d8;display:flex;align-items:center;justify-content:center;overflow:hidden}.wishlist-image img{width:100%;height:100%;object-fit:cover}
        .wishlist-body{padding:18px;display:flex;flex-direction:column;flex:1}.wishlist-name{margin:0 0 10px;font:700 17px Montserrat,sans-serif;color:#4b2e22}.wishlist-price{font:600 15px Montserrat,sans-serif;color:#bd3d2f;margin-bottom:14px}
        .wishlist-actions{display:flex;gap:8px;margin-top:auto}.wishlist-btn{flex:1;border:0;padding:10px;border-radius:4px;cursor:pointer;font:600 12px Montserrat,sans-serif}.view-btn{background:#bd3d2f;color:#fff}.view-btn:hover{background:#a53527}.remove-btn{background:#fff;color:#bd3d2f;border:1px solid #bd3d2f}.remove-btn:hover{background:#fef5f3}
        .empty-state{text-align:center;padding:80px 20px;background:#fff;border-radius:8px}.empty-state h2{font:700 24px Montserrat,sans-serif;color:#4b2e22;margin:0 0 12px}.empty-state p{color:#806d62;margin:0 0 24px}.empty-state a{display:inline-block;background:#bd3d2f;color:#fff;padding:12px 28px;border-radius:4px;font:600 13px Montserrat,sans-serif;text-decoration:none}.empty-state a:hover{background:#a53527}
        .customer-footer{padding:32px 6%;background:#4b2e22;color:#fff;text-align:center;font-size:13px;margin-top:auto}
        @media(max-width:760px){.customer-nav{flex-wrap:wrap;padding:14px 5%}.customer-links{order:3;width:100%;justify-content:space-between;gap:8px}.customer-links a{font-size:11px}.customer-account{margin-left:auto}.customer-main{padding:38px 5%}.wishlist-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}}
    </style>
</head>
<body class="customer-page">
    <header class="customer-nav">
        <a href="home.html" aria-label="Kopi Jago"><img src="../logo%20jago2.png" alt="Jago Coffee"></a>
        <nav class="customer-links" aria-label="Navigasi customer">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="cart.html">Keranjang <span id="cart-badge">(0)</span></a>
            <a href="orders.html">Pesanan</a>
            <a href="wishlist.html" class="active">Wishlist</a>
        </nav>
        <div id="account-area" class="customer-account"></div>
    </header>
    <main class="customer-main">
        <div class="page-heading">
            <h1>Wishlist Saya</h1>
            <p>Minuman favoritmu yang disimpan</p>
        </div>
        <div id="wishlist-content"></div>
    </main>
    <footer class="customer-footer">© 2026 Kopi Jago. Minuman favorit, diantar dengan jago.</footer>
    <script src="../frontend/src/js/routes.js"></script>
    <script src="../frontend/src/js/api.js"></script>
    <script src="shared.js"></script>
    <script>
        // esc, token, api, showAccount, loadCartCount, imageByName, sizeLabel now from shared.js

        async function loadWishlist() {
            const content = document.getElementById('wishlist-content');
            
            if (!token()) {
                content.innerHTML = `<div class="empty-state">
                    <h2>Login Diperlukan</h2>
                    <p>Login untuk melihat wishlist</p>
                    <a href="../login.html">Login Sekarang</a>
                </div>`;
                return;
            }

            // Loading state
            content.innerHTML = '<div style="text-align:center;padding:60px"><p>Memuat wishlist...</p></div>';

            try {
                const items = await api('wishlist');
                console.log('[Wishlist Page] Items loaded:', items.length);
                
                if (items.length === 0) {
                    content.innerHTML = `<div class="empty-state">
                        <h2>Wishlist Kosong</h2>
                        <p>Belum ada minuman di wishlist</p>
                        <a href="home.html#menu">Lihat Menu</a>
                    </div>`;
                    return;
                }

                content.innerHTML = `<div class="wishlist-grid">
                    ${items.map(item => `
                        <div class="wishlist-card">
                            <div class="wishlist-image">
                                <img src="${imageByName[item.name] || '../kopsu%20jago.jfif'}" alt="${esc(item.name)}">
                            </div>
                            <div class="wishlist-body">
                                <h3 class="wishlist-name">${esc(item.name)}</h3>
                                <p class="wishlist-price">Mulai dari Rp ${Number(item.price).toLocaleString('id-ID')}</p>
                                <div class="wishlist-actions">
                                    <button class="wishlist-btn view-btn" onclick="location.href='home.html#menu'">Lihat Menu</button>
                                    <button class="wishlist-btn remove-btn" data-menu-id="${item.menu_id}">Hapus</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>`;

                // Attach remove handlers
                content.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', () => removeFromWishlist(btn.dataset.menuId));
                });

            } catch (error) {
                console.error('[Wishlist Page] Load error:', error);
                content.innerHTML = `<div class="empty-state">
                    <h2>Error</h2>
                    <p>${esc(error.message)}</p>
                    <button onclick="loadWishlist()" style="background:#bd3d2f;color:#fff;border:0;padding:12px 28px;border-radius:4px;cursor:pointer">Coba Lagi</button>
                </div>`;
            }
        }

        async function removeFromWishlist(menuId) {
            try {
                await api(`wishlist?menu_id=${menuId}`, {method: 'DELETE'});
                await loadWishlist();
            } catch (error) {
                alert(error.message);
            }
        }

        showAccount();
        loadCartCount();
        loadWishlist();
    </script>
</body>
</html>
