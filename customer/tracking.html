<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lacak Pesanan - Kopi Jago</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="tracking.css">
</head>
<body class="tracking-page">
    <header class="customer-header">
        <div class="header-content">
            <a href="home.html#home" class="logo">JAGO COFFEE</a>
            <button class="account-btn" id="account-btn" aria-label="Akun">
                <span id="account-name">Akun</span>
            </button>
        </div>
        <nav class="customer-links" aria-label="Navigasi customer">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="find-jagoan.html">Find Jagoan</a>
            <a href="cart.html">Keranjang <span id="cart-badge">(0)</span></a>
            <a href="orders.html">Pesanan</a>
            <a href="jago-party.html">Jago Party</a>
        </nav>
    </header>

    <main class="tracking-main">
        <!-- Order Status Timeline -->
        <section class="status-timeline" id="status-timeline">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading order...</p>
            </div>
        </section>

        <!-- Map Section -->
        <section class="tracking-map-section" id="map-section" style="display:none">
            <div class="map-header">
                <h2>Lokasi Jagoan</h2>
                <button class="btn-refresh" id="refresh-btn" aria-label="Refresh">🔄 Refresh</button>
            </div>
            <div id="tracking-map" class="tracking-map"></div>
            
            <!-- ETA Card -->
            <div class="eta-card" id="eta-card" style="display:none">
                <div class="eta-icon">🚴</div>
                <div class="eta-info">
                    <p class="eta-label">Estimasi Tiba</p>
                    <h3 class="eta-time" id="eta-time">15 menit</h3>
                    <p class="eta-distance" id="eta-distance">2.5 km</p>
                </div>
            </div>
        </section>

        <!-- Order Details -->
        <section class="order-details-card" id="order-details">
            <!-- Populated by JS -->
        </section>

        <!-- Seller Info -->
        <section class="seller-info-card" id="seller-info" style="display:none">
            <!-- Populated by JS -->
        </section>
    </main>

    <footer class="customer-footer">
        <p>&copy; 2026 Kopi Jago. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="shared.js"></script>
    <script src="tracking.js"></script>
</body>
</html>
