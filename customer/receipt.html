<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Struk Pembayaran - Kopi Jago</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <style>
        .receipt-page{background:#f8f3ee;min-height:100vh;padding:100px 0 60px}
        .receipt-container{max-width:600px;margin:0 auto;padding:0 6%}
        .receipt-card{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(75,46,34,0.08);overflow:hidden}
        .receipt-header{background:#bd3d2f;color:#fff;text-align:center;padding:32px 24px}
        .receipt-header h1{font:900 28px Montserrat,sans-serif;margin:0 0 8px}
        .receipt-header p{margin:0;opacity:0.9;font-size:14px}
        .receipt-success{background:#4CAF50;color:#fff;text-align:center;padding:20px;font-size:18px;font-weight:600}
        .receipt-body{padding:32px 24px}
        .receipt-section{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid #eadfd7}
        .receipt-section:last-child{border:0;margin:0;padding:0}
        .receipt-label{font:600 12px Montserrat,sans-serif;color:#806d62;text-transform:uppercase;margin:0 0 8px}
        .receipt-value{font:400 15px 'Open Sans',sans-serif;color:#4b2e22;margin:0 0 12px}
        .receipt-order-num{font:700 20px Montserrat,sans-serif;color:#bd3d2f;margin:0}
        .receipt-items{margin-top:16px}
        .receipt-item{display:flex;justify-content:space-between;padding:10px 0;font-size:14px;color:#4b2e22}
        .receipt-item-name{flex:1}
        .receipt-item-qty{color:#806d62;margin:0 12px}
        .receipt-item-price{font-weight:600}
        .receipt-summary{margin-top:20px}
        .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px}
        .summary-row.total{font:700 20px Montserrat,sans-serif;color:#bd3d2f;border-top:2px solid #eadfd7;margin-top:12px;padding-top:16px}
        .receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:32px}
        .btn-receipt{border:0;padding:14px 20px;border-radius:8px;font:600 14px Montserrat,sans-serif;cursor:pointer;transition:all 0.2s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:50px}
        .btn-primary{background:#bd3d2f;color:#fff}
        .btn-primary:hover{background:#a53527}
        .btn-secondary{background:#fff;color:#bd3d2f;border:2px solid #bd3d2f}
        .btn-secondary:hover{background:#fef5f3}
        .print-only{display:none}
        @media print{
            body{padding:0;background:#fff}
            .receipt-page{padding:0}
            .receipt-card{box-shadow:none;border-radius:0}
            .receipt-actions,.customer-nav,.customer-footer{display:none}
            .print-only{display:block}
        }
        @media(max-width:768px){
            .receipt-page{padding:80px 4% 40px}
            .receipt-actions{grid-template-columns:1fr}
        }
    </style>
</head>
<body class="customer-page receipt-page">
    <header class="customer-nav" id="navbar">
        <a href="home.html#home" aria-label="Kopi Jago">
            <img src="../logo%20jago2.png" alt="Jago Coffee" class="nav-logo">
        </a>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <nav class="customer-links" id="nav-links">
            <a href="home.html#home">Home</a>
            <a href="home.html#menu">Menu</a>
            <a href="cart.html">Keranjang</a>
            <a href="orders.html">Pesanan</a>
        </nav>
        <div id="account-area" class="customer-account"></div>
    </header>
    
    <main class="receipt-container">
        <div class="receipt-card">
            <div class="receipt-header">
                <h1>✓ Pembayaran Berhasil</h1>
                <p>Terima kasih atas pesanan Anda!</p>
            </div>
            
            <div class="receipt-success" id="payment-notice">
                ⚠️ SIMULASI PEMBAYARAN - TIDAK ADA UANG SUNGGUHAN YANG DITRANSFER
            </div>
            
            <div class="receipt-body" id="receipt-content">
                <p style="text-align:center;color:#806d62;">Memuat struk...</p>
            </div>
        </div>
    </main>
    
    <footer class="customer-footer">© 2026 Kopi Jago. Minuman favorit, diantar dengan jago.</footer>
    
    <script src="../assets/js/jago-core.js"></script>
    <script src="shared.js"></script>
    <script>
        let order = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            showAccount();
            
            const orderId = new URLSearchParams(location.search).get('order_id');
            if (!orderId) {
                alert('Order ID tidak ditemukan');
                location.href = 'orders.html';
                return;
            }
            
            try {
                order = await api('orders/' + orderId);
                renderReceipt();
            } catch (error) {
                console.error('[Receipt] Load error:', error);
                document.getElementById('receipt-content').innerHTML = `
                    <div style="text-align:center;padding:40px 20px;">
                        <p style="color:#dc2626;margin-bottom:16px;">Gagal memuat struk: ${esc(error.message)}</p>
                        <a href="orders.html" class="btn-primary" style="display:inline-block;padding:12px 24px;">Lihat Pesanan Saya</a>
                    </div>
                `;
            }
        });
        
        function renderReceipt() {
            if (!order) return;
            
            const isPaid = order.payment_status === 'paid';
            
            document.getElementById('receipt-content').innerHTML = `
                <div class="receipt-section">
                    <p class="receipt-label">Nomor Pesanan</p>
                    <p class="receipt-order-num">#${esc(order.order_number)}</p>
                </div>
                
                <div class="receipt-section">
                    <p class="receipt-label">Tanggal & Waktu</p>
                    <p class="receipt-value">${new Date(order.created_at).toLocaleString('id-ID', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}</p>
                </div>
                
                <div class="receipt-section">
                    <p class="receipt-label">Status Pembayaran</p>
                    <p class="receipt-value" style="color:${isPaid ? '#4CAF50' : '#ff9800'};font-weight:600;">
                        ${isPaid ? '✓ Lunas' : '⏳ Menunggu Pembayaran'}
                    </p>
                    <p class="receipt-label" style="margin-top:12px;">Metode Pembayaran</p>
                    <p class="receipt-value">${getPaymentMethodLabel(order.payment_method)}</p>
                </div>
                
                <div class="receipt-section">
                    <p class="receipt-label">Metode Pengambilan</p>
                    <p class="receipt-value">${order.fulfillment_type === 'pickup' ? '🚶 Ambil di Tempat' : '🚲 Antar ke Lokasi'}</p>
                    ${order.address_line ? `
                        <p class="receipt-label" style="margin-top:12px;">Alamat Pengiriman</p>
                        <p class="receipt-value">${esc(order.address_line)}<br>${esc(order.city)}, ${esc(order.province)}</p>
                    ` : ''}
                </div>
                
                <div class="receipt-section">
                    <p class="receipt-label">Detail Pesanan</p>
                    <div class="receipt-items">
                        ${order.items.map(item => `
                            <div class="receipt-item">
                                <span class="receipt-item-name">${esc(item.name)} (${getSizeLabel(item.size)})</span>
                                <span class="receipt-item-qty">×${item.qty}</span>
                                <span class="receipt-item-price">Rp ${Number(item.price * item.qty).toLocaleString('id-ID')}</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="receipt-summary">
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span>Rp ${Number(order.subtotal).toLocaleString('id-ID')}</span>
                        </div>
                        <div class="summary-row">
                            <span>Ongkir</span>
                            <span>${Number(order.shipping_cost) === 0 ? 'GRATIS' : 'Rp ' + Number(order.shipping_cost).toLocaleString('id-ID')}</span>
                        </div>
                        ${Number(order.discount_amount) > 0 ? `
                            <div class="summary-row">
                                <span>Diskon</span>
                                <span style="color:#4CAF50;">-Rp ${Number(order.discount_amount).toLocaleString('id-ID')}</span>
                            </div>
                        ` : ''}
                        <div class="summary-row total">
                            <span>Total</span>
                            <span>Rp ${Number(order.total_amount).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                </div>
                
                ${order.notes ? `
                    <div class="receipt-section">
                        <p class="receipt-label">Catatan</p>
                        <p class="receipt-value">${esc(order.notes)}</p>
                    </div>
                ` : ''}
                
                <div class="receipt-actions">
                    <button onclick="window.print()" class="btn-receipt btn-secondary">🖨️ Cetak Struk</button>
                    <a href="orders.html" class="btn-receipt btn-primary">Lihat Pesanan Saya</a>
                </div>
                
                <div class="print-only" style="text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid #eadfd7;font-size:12px;color:#806d62;">
                    <p>Terima kasih telah memesan di Kopi Jago!</p>
                    <p>Untuk pertanyaan, hubungi customer service kami.</p>
                </div>
            `;
        }
        
        function getPaymentMethodLabel(method) {
            const labels = {
                'qris': 'QRIS',
                'gopay': 'GoPay',
                'shopeepay': 'ShopeePay',
                'ovo': 'OVO',
                'dana': 'DANA',
                'bank_transfer': 'Transfer Bank',
                'cash': 'Tunai'
            };
            return labels[method] || method;
        }
    </script>
</body>
</html>
